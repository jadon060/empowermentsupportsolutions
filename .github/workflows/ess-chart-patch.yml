name: ESS chart patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ess-chart-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact starting pages and install tested replacements
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Hayden_H.html)" = "5c2c3a434d8d0089d1e1668f14819b1ff17eb6e0"
          test "$(git hash-object omar-v.html)" = "5391758cad6cf00d57b2101381bda4e6dcc80ddf"

          python - <<'PY'
          from pathlib import Path
          import base64, zlib, subprocess

          jobs = [
              ("Hayden_H.html", ".ess-patch/hayden.z64", "ff5110ebb460c1c985fa5f0ad259e05884f655a4"),
              ("omar-v.html", ".ess-patch/omar.z64", "868f27c3857bfbafc9593e597e44ffab8add2c14"),
          ]

          for target, payload, expected in jobs:
              raw = zlib.decompress(base64.b64decode(Path(payload).read_text().strip()))
              Path(target).write_bytes(raw)
              got = subprocess.check_output(["git", "hash-object", target], text=True).strip()
              if got != expected:
                  raise SystemExit(f"Integrity check failed for {target}: {got} != {expected}")
              print(f"Verified {target}: {got}")
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          for html, out in [("Hayden_H.html", "/tmp/hayden.js"), ("omar-v.html", "/tmp/omar.js")]:
              text = Path(html).read_text()
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
              inline = max(scripts, key=len)
              Path(out).write_text(inline)
          PY

          node --check /tmp/hayden.js
          node --check /tmp/omar.js

      - name: Commit only the two page changes and clean temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ESS verified patch"
          git config user.email "actions@users.noreply.github.com"
          git add Hayden_H.html omar-v.html
          git rm -f .ess-patch/hayden.z64 .ess-patch/omar.z64 .github/workflows/ess-chart-patch.yml
          git commit -m "Add chart drafts and set Omar monthly hours to 122"
          git push origin HEAD:main
