name: ESS draft schema compatibility fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/draft-schema-compat.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and patch draft saving
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Commit verified fix and clean workflow
        shell: bash
        run: |
          git config user.name "ESS verified patch"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/draft-schema-compat.yml
          git add Hayden_H.html omar-v.html
          git diff --cached --check
          git commit -m "Make Omar and Hayden draft saving schema-compatible"
          git push origin main
