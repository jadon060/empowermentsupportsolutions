name: ESS Apply Live Draft Patch

on:
  push:
    paths:
      - '.github/workflows/apply-live-draft-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch
        run: python3 .ess_tmp/live_draft_patch.py
      - name: Commit patched pages and cleanup
        run: |
          rm -f .ess_tmp/live_draft_patch.py
          rm -f .github/workflows/apply-live-draft-patch.yml
          git config user.name "ESS verified patch"
          git config user.email "actions@users.noreply.github.com"
          git add Hayden_H.html omar-v.html .ess_tmp/live_draft_patch.py .github/workflows/apply-live-draft-patch.yml
          git diff --cached --quiet && exit 0
          git commit -m "Make staff chart drafts live across devices"
          git push origin main
