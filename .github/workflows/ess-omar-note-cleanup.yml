name: ESS Omar note cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ess-omar-note-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate helper note safely
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object omar-v.html)" = "868f27c3857bfbafc9593e597e44ffab8add2c14"
          python - <<'PY'
          from pathlib import Path
          p=Path('omar-v.html')
          s=p.read_text()
          duplicate='    <div style="margin-top:8px;text-align:right;color:#64748b;font-size:12px;line-height:1.4">Save Draft keeps the chart so you can return later for Omar’s signature. Draft hours do not count until officially submitted.</div>\n'
          if s.count(duplicate) != 1:
              raise SystemExit(f'Expected exactly one duplicate helper note, found {s.count(duplicate)}')
          p.write_text(s.replace(duplicate,'',1))
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('omar-v.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S)
          Path('/tmp/omar.js').write_text(max(scripts,key=len))
          assert text.count('id="w_saveDraft"') == 1
          assert 'OMAR_MONTHLY_APPROVED=122' in text
          assert 'Saved drafts do not count toward completed hours.' in text
          PY
          node --check /tmp/omar.js
      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ESS verified patch"
          git config user.email "actions@users.noreply.github.com"
          git add omar-v.html
          git rm -f .github/workflows/ess-omar-note-cleanup.yml
          git commit -m "Clean up Omar draft helper text"
          git push origin HEAD:main
