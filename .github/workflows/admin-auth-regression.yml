name: ESS Admin PIN Regression

on:
  pull_request:
    paths:
      - 'login.html'
      - 'portal/admin.html'
      - 'portal/admin-notebooks.js'
      - 'portal/admin-dashboard.css'
      - 'portal/staff-hours-report.html'
      - 'portal/staff-hours-report.js'
      - 'tests/admin-hours-report.test.cjs'
      - 'tests/admin-pin-gateway.test.cjs'
      - 'tests/admin-notebooks.test.cjs'
      - 'tests/omar-tracker-admin.test.cjs'
      - 'portal/omar-tracker-admin.html'
      - 'portal/omar-tracker-admin.js'
      - 'omar-service-hours.js'
      - 'omar-v.html'
      - 'db/omar-tracker-monthly-manual.sql'
      - '.github/workflows/admin-auth-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Admin PIN gateway and notebooks
        run: node --test tests/admin-notebooks.test.cjs tests/admin-pin-gateway.test.cjs tests/omar-tracker-admin.test.cjs tests/admin-hours-report.test.cjs
