<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ESS Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --brand:#1b7ea0; --brand-2:#2fb6a6; --bg:#f7f7fb; }
    *,*::before,*::after{ box-sizing:border-box; }
    body { margin:0; display:grid; place-items:center; min-height:100vh; background:var(--bg); font-family:Arial,Helvetica,sans-serif; }
    .wrap { width:100%; max-width:380px; border-radius:12px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.08); background:#fff; }
    header { background:linear-gradient(120deg,var(--brand),var(--brand-2),var(--brand)); background-size:300% 300%; animation:gradientPulse 10s ease-in-out infinite; color:#fff; padding:20px; text-align:center; }
    header h1 { margin:0; font-size:1.5rem; font-weight:700; letter-spacing:.3px; }
    @keyframes gradientPulse { 0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%} }
    .card { padding:22px; text-align:center; } p { margin:0 0 12px; color:#555; }
    input,button { width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; font-size:16px; transition:border .2s,box-shadow .2s; }
    input:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(27,126,160,.25); }
    button { margin-top:12px; background:var(--brand); color:#fff; border:0; font-weight:600; cursor:pointer; transition:background .2s ease; } button:hover{background:#166b88}
    .err { color:#b00020; margin-top:8px; min-height:1.2em; }
    a.home { display:inline-block; margin-top:10px; color:var(--brand); text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div class="wrap"><header><h1>ESS Login</h1></header><div class="card"><p>Enter credentials to access your portal.</p><input id="pw" type="password" placeholder="Password / Client PIN" autocomplete="current-password" inputmode="numeric"><button id="go">Login</button><div id="err" class="err"></div><a class="home" href="/index.html">← Back to Home</a></div></div>
  <script>
    // Shared ESS PIN gateway. Existing PIN values are verified on the secure backend.
    // This page never stores or embeds portal PINs or Supabase privileged keys.
    const ESS_PIN_API = 'https://bqanjupmcgydvmfgvutx.supabase.co/functions/v1/ess-portal-auth';
    const ESS_DESTINATIONS = new Set([
      '/portal/admin.html', '/omar-v.html', '/jeremy-n.html',
      '/Hayden_H.html', '/families.html', '/staff.html'
    ]);
    const ESS_EXPORT_FLAGS = new Set(['ESS_EXPORT_OMAR', 'ESS_EXPORT_JEREMY']);
    let submitting = false;

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error('Secure ESS connection could not load.'));
        document.head.append(script);
      });
    }
    async function adminClient() {
      if (!window.ESSAdminSession?.client) {
        if (!window.supabase) await loadScript('/portal/vendor/supabase-2.117.3.js');
        await loadScript('/portal/admin-session.js?v=20261016-pin-session');
      }
      if (!window.ESSAdminSession?.client) throw new Error('Secure ESS connection unavailable.');
      return window.ESSAdminSession.client;
    }
    async function route() {
      if (submitting) return;
      const input = document.getElementById('pw'), go = document.getElementById('go');
      const err = document.getElementById('err'), pin = input.value.trim();
      if (!pin) { err.textContent = 'Please enter a password or PIN.'; return; }
      submitting = true; go.disabled = true; err.textContent = 'Opening your ESS portal…';
      try {
        const response = await fetch(ESS_PIN_API, {
          method: 'POST', mode: 'cors', cache: 'no-store', credentials: 'omit',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scope: 'shared', pin })
        });
        const result = await response.json();
        if (!response.ok || !result?.ok) {
          throw new Error(result?.error || 'Secure ESS login failed. Please try again.');
        }
        if (!ESS_DESTINATIONS.has(result.destination)) {
          throw new Error('Invalid portal destination. Contact ESS administration.');
        }
        if (result.destination === '/portal/admin.html') {
          if (!result.session?.access_token || !result.session?.refresh_token) {
            throw new Error('Admin session was not established. Please try again.');
          }
          const client = await adminClient();
          const { data: sessionData, error: sessionError } = await client.auth.setSession({
            access_token: result.session.access_token,
            refresh_token: result.session.refresh_token
          });
          if (sessionError || !sessionData?.session) {
            throw new Error('Admin session could not be saved. Please try again.');
          }
          const { data: allowed, error: accessError } = await client.rpc('staff_hours_admin_access');
          if (accessError || !allowed) {
            await client.auth.signOut({ scope: 'local' });
            throw new Error('Administrator permissions could not be confirmed.');
          }
          // Legacy flag keeps unrelated admin UI compatible; RLS uses verified Auth identity.
          try { localStorage.removeItem('sb-bqanjupmcgydvmfgvutx-auth-token'); localStorage.setItem('ESS_Admin_Login', 'true'); } catch {}
        } else {
          // Never carry a previous administrator session into a shared non-admin login.
          try {
            if (window.ESSAdminSession?.client || localStorage.getItem('sb-bqanjupmcgydvmfgvutx-auth-token')) {
              const client = await adminClient();
              await client.auth.signOut({ scope: 'local' });
            }
          } catch {}
          try { localStorage.removeItem('sb-bqanjupmcgydvmfgvutx-auth-token'); localStorage.removeItem('ESS_Admin_Login'); } catch {}
          if (ESS_EXPORT_FLAGS.has(result.session_flag)) {
            try { sessionStorage.setItem(result.session_flag, 'true'); } catch {}
          }
        }
        input.value = '';
        location.replace(result.destination);
      } catch (error) {
        err.textContent = error.message || 'Secure ESS login unavailable. Please try again.';
        go.disabled = false;
        submitting = false;
      }
    }
    document.getElementById('go').addEventListener('click', route);
    document.getElementById('pw').addEventListener('keydown', event => {
      if (event.key === 'Enter') route();
    });
  </script>
</body></html>
