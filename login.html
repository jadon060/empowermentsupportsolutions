<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ESS Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --brand:#1b7ea0; --brand-2:#2fb6a6; --bg:#f7f7fb; }
    *,*::before,*::after{ box-sizing:border-box; }
    body { margin:0; display:grid; place-items:center; min-height:100vh; background:var(--bg); font-family:Arial,Helvetica,sans-serif; }
    .wrap { width:100%; max-width:380px; border-radius:12px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.08); background:#fff; }
    header { background:linear-gradient(120deg,var(--brand),var(--brand-2),var(--brand)); background-size:300% 300%; animation:gradientPulse 10s ease-in-out infinite; color:#fff; padding:20px; text-align:center; }
    header h1 { margin:0; font-size:1.5rem; font-weight:700; letter-spacing:.3px; }
    @keyframes gradientPulse { 0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%} }
    .card { padding:22px; text-align:center; } p { margin:0 0 12px; color:#555; }
    input,button { width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; font-size:16px; transition:border .2s,box-shadow .2s; }
    input:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(27,126,160,.25); }
    button { margin-top:12px; background:var(--brand); color:#fff; border:0; font-weight:600; cursor:pointer; transition:background .2s ease; } button:hover{background:#166b88}
    .err { color:#b00020; margin-top:8px; min-height:1.2em; }
    a.home { display:inline-block; margin-top:10px; color:var(--brand); text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div class="wrap"><header><h1>ESS Login</h1></header><div class="card"><p>Enter credentials to access your portal.</p><input id="pw" type="password" placeholder="Password / Client PIN" autocomplete="current-password" inputmode="numeric"><button id="go">Login</button><div id="err" class="err"></div><a class="home" href="/index.html">← Back to Home</a></div></div>
  <script>
    const FAMILY_PW = "08052023";
    const STAFF_PW  = "05041993";
    const HAYDEN_PW = "0715";
    const JEREMY_PW = "0926";
    const OMAR_PW   = "0125";
    const ADMIN_PW  = "10301993";
    // Complete the one-time Supabase recovery callback by activating the existing ESS admin PIN.
    function loadScript(src){return new Promise((resolve,reject)=>{const existing=[...document.scripts].find(s=>s.src.includes(src));if(existing){if(existing.dataset.loaded==='true'){resolve();return;}existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',()=>reject(new Error('Secure ESS sign-in could not load.')), {once:true});return;}const script=document.createElement('script');script.src=src;script.onload=()=>{script.dataset.loaded='true';resolve();};script.onerror=()=>reject(new Error('Secure ESS sign-in could not load.'));document.head.append(script);});}
    async function adminClient(){await loadScript('/portal/vendor/supabase-2.117.3.js');await loadScript('/portal/admin-session.js?v=20261016-repairs');const client=window.ESSAdminSession?.client;if(!client)throw new Error('Secure ESS sign-in could not connect.');return client;}
    (async function finishAdminAuthReturn(){
      const params=new URLSearchParams(location.search);
      if(params.get("admin")!=="1"||params.get("recovery")!=="1")return;
      const err=document.getElementById("err");err.textContent="Activating your existing ESS admin PIN…";
      try{
        const client=await adminClient();
        const {data,error}=await client.auth.getSession();if(error)throw error;if(!data.session)throw new Error("This recovery link expired or was already used. Return to the ESS login and enter your existing admin PIN.");
        const {error:updateError}=await client.auth.updateUser({password:ADMIN_PW});if(updateError)throw updateError;
        const {data:authorized,error:accessError}=await client.rpc('staff_hours_admin_access');if(accessError)throw accessError;if(!authorized){await client.auth.signOut();throw new Error('This account is not authorized for ESS administration.');}
        try{localStorage.setItem("ESS_Admin_Login","true");localStorage.removeItem("ESS_Admin_Notebook_Link_Sent_At");localStorage.removeItem("ESS_Admin_Notebook_Link_Cooldown");}catch(e){}
        location.replace("/portal/admin.html");
      }catch(error){err.textContent=error.message||"Secure sign-in could not be completed. Return to the Admin Portal and try again.";}
    })();
    async function route(){
      const val=(document.getElementById("pw").value||"").trim(),err=document.getElementById("err");
      if(!val){err.textContent="Please enter a password or PIN.";return;}
      if(val===ADMIN_PW){
        const go=document.getElementById('go');go.disabled=true;err.textContent='Opening your ESS admin workspace…';
        try{
          const client=await adminClient(),{error}=await client.auth.signInWithPassword({email:window.ESSAdminSession.email,password:ADMIN_PW});
          if(!error){const {data:authorized,error:accessError}=await client.rpc('staff_hours_admin_access');if(accessError)throw accessError;if(!authorized){await client.auth.signOut();throw new Error('This account is not authorized for ESS administration.');}try{localStorage.setItem('ESS_Admin_Login','true');}catch(e){}location.replace('/portal/admin.html');return;}
          if(error.status===400&&/invalid login credentials/i.test(error.message||'')){try{localStorage.setItem('ESS_Admin_Login','true');}catch(e){}location.replace('/portal/admin.html');return;}
          throw error;
        }catch(error){err.textContent=error.message||'ESS admin sign-in could not connect. Try again when online.';go.disabled=false;return;}
      }
      if(val===OMAR_PW){try{sessionStorage.setItem("ESS_EXPORT_OMAR","true")}catch(e){} location.href="/omar-v.html";return;}
      if(val===JEREMY_PW){try{sessionStorage.setItem("ESS_EXPORT_JEREMY","true")}catch(e){} location.href="/jeremy-n.html";return;}
      if(val===HAYDEN_PW){location.href="/Hayden_H.html";return;}
      if(val===FAMILY_PW){location.href="/families.html";return;}
      if(val===STAFF_PW){location.href="/staff.html";return;}
      err.textContent="Wrong password or PIN. Please try again.";
    }
    document.getElementById("go").addEventListener("click",()=>route());
    document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")route()});
  </script>
</body></html>
