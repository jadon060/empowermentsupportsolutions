<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ESS Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --brand:#1b7ea0; --brand-2:#2fb6a6; --bg:#f7f7fb; }
    *,*::before,*::after{ box-sizing:border-box; }
    body { margin:0; display:grid; place-items:center; min-height:100vh; background:var(--bg); font-family:Arial,Helvetica,sans-serif; }
    .wrap { width:100%; max-width:380px; border-radius:12px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.08); background:#fff; }
    header { background:linear-gradient(120deg,var(--brand),var(--brand-2),var(--brand)); background-size:300% 300%; animation:gradientPulse 10s ease-in-out infinite; color:#fff; padding:20px; text-align:center; }
    header h1 { margin:0; font-size:1.5rem; font-weight:700; letter-spacing:.3px; }
    @keyframes gradientPulse { 0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%} }
    .card { padding:22px; text-align:center; } p { margin:0 0 12px; color:#555; }
    input,button { width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; font-size:16px; transition:border .2s,box-shadow .2s; }
    input:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(27,126,160,.25); }
    button { margin-top:12px; background:var(--brand); color:#fff; border:0; font-weight:600; cursor:pointer; transition:background .2s ease; } button:hover{background:#166b88}
    .err { color:#b00020; margin-top:8px; min-height:1.2em; }
    a.home { display:inline-block; margin-top:10px; color:var(--brand); text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div class="wrap"><header><h1>ESS Login</h1></header><div class="card"><p>Enter credentials to access your portal.</p><input id="pw" type="password" placeholder="Password / Client PIN" autocomplete="current-password" inputmode="numeric"><button id="go">Login</button><div id="err" class="err"></div><a class="home" href="/index.html">← Back to Home</a></div></div>
  <script src="/portal/vendor/supabase-2.117.3.js"></script>
  <script src="/portal/admin-session.js?v=20261016-repairs"></script>
  <script>
    const FAMILY_PW = "08052023";
    const STAFF_PW  = "05041993";
    const HAYDEN_PW = "0715";
    const JEREMY_PW = "0926";
    const OMAR_PW   = "0125";
    const session=window.ESSAdminSession, adminMode=new URLSearchParams(location.search).get('admin')==='1', recoveryMode=new URLSearchParams(location.search).get('recovery')==='1';
    let recovering=false;
    const adminLink=document.createElement('a');adminLink.className='home';adminLink.href='/login.html?admin=1';adminLink.textContent='ESS Admin login';document.querySelector('.card').append(document.createElement('br'),adminLink);
    if(adminMode){document.querySelector('h1').textContent='ESS Admin Login';document.querySelector('.card p').textContent='Enter your ESS admin password. Your session stays signed in on this device.';document.getElementById('pw').placeholder='Admin password';document.getElementById('pw').removeAttribute('inputmode');adminLink.hidden=true;}
    const reset=document.createElement('button');reset.type='button';reset.textContent='Set or reset admin password';reset.style.cssText='background:#eef3ff;color:#315fce';reset.hidden=!adminMode;document.querySelector('.card').append(reset);
    reset.addEventListener('click',async()=>{reset.disabled=true;const {error}=await session.client.auth.resetPasswordForEmail(session.email,{redirectTo:location.origin+'/login.html?admin=1&recovery=1'});document.getElementById('err').textContent=error?error.message:'Check your ESS inbox to choose your admin password once. Future visits use your remembered session.';reset.disabled=false;});
    async function adminLogin(password){
      if(!session?.client)throw new Error('Could not load secure login. Refresh and try again.');
      const {error}=await session.client.auth.signInWithPassword({email:session.email,password});
      if(error)throw new Error('Admin password was not accepted. Use your secure ESS admin account password.');
      const access=await session.client.rpc('staff_hours_admin_access');
      if(access.error||!access.data){await session.client.auth.signOut();throw new Error('This account is not authorized for ESS administration.');}
      localStorage.setItem('ESS_Admin_Login','true');location.replace('/portal/admin.html');
    }
    async function route(){
      const raw=document.getElementById("pw").value||"",val=raw.trim(),err=document.getElementById("err");
      if(!val){err.textContent="Please enter a password or PIN.";return;}
      if(recovering){if(raw.length<12){err.textContent='Choose a password with at least 12 characters.';return;}document.getElementById('go').disabled=true;const {error}=await session.client.auth.updateUser({password:raw});if(error){err.textContent=error.message;document.getElementById('go').disabled=false}else location.replace('/portal/admin.html');return;}
      if(adminMode){document.getElementById('go').disabled=true;err.textContent='Signing in…';try{await adminLogin(raw)}catch(e){err.textContent=e.message}finally{document.getElementById('go').disabled=false}return;}
      if(val===OMAR_PW){try{sessionStorage.setItem("ESS_EXPORT_OMAR","true")}catch(e){} location.href="/omar-v.html";return;}
      if(val===JEREMY_PW){try{sessionStorage.setItem("ESS_EXPORT_JEREMY","true")}catch(e){} location.href="/jeremy-n.html";return;}
      if(val===HAYDEN_PW){location.href="/Hayden_H.html";return;}
      if(val===FAMILY_PW){location.href="/families.html";return;}
      if(val===STAFF_PW){location.href="/staff.html";return;}
      err.textContent='Wrong password or PIN. For administrator access, use ESS Admin login.';
    }
    document.getElementById("go").addEventListener("click",route);
    document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")route()});
    function showRecovery(){recovering=true;reset.hidden=true;document.querySelector('h1').textContent='Choose admin password';document.querySelector('.card p').textContent='Choose a unique password with at least 12 characters.';document.getElementById('pw').autocomplete='new-password';document.getElementById('pw').placeholder='New admin password';document.getElementById('go').textContent='Save admin password';}
    if(adminMode&&session?.client){session.client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showRecovery()});session.client.auth.getSession().then(async({data})=>{if(data.session){const r=await session.client.rpc('staff_hours_admin_access');if(r.data){if(recoveryMode)showRecovery();else if(!recovering)location.replace('/portal/admin.html')}}});}
  </script>
</body></html>
