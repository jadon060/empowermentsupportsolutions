<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESS Admin</title><style>body{font-family:system-ui;background:#f6f8fc;margin:0;color:#0f172a}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 12px 34px rgba(0,0,0,.08)}.row{display:grid;grid-template-columns:1fr auto;gap:10px;margin:10px 0}.link,.btn{border:0;border-radius:14px;padding:12px 16px;background:#0f4c81;color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.box{width:min(540px,100%);background:#fff;border-radius:20px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;color:#64748b;font-weight:800;text-transform:uppercase}input{width:100%;padding:10px;border:1px solid #dbe7f5;border-radius:12px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}.ghost{background:#fff;color:#0f172a;border:1px solid #e5e7eb}.err{display:none;color:#991b1b;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:10px;margin-top:12px}</style><script>try{if(localStorage.getItem('ESS_Admin_Login')!=='true')location.replace('/portal/login.html')}catch(e){location.replace('/portal/login.html')}</script></head><body><main class="wrap"><h1>ESS Admin Portal</h1><div class="card"><h2>Admin tools</h2><p><a class="link" href="/admin-export.html">📋 SDP Daily Charting + Weekly Calendar Export</a></p><p><a class="link" href="/portal/admin-sdp-coordination.html">🧭 Admin SDP Coordination Guide</a></p></div><br><div class="card"><h2>Client portals + hours</h2><div id="clients"></div></div></main><div class="modal" id="modal"><div class="box"><h2 id="title">Update Hours</h2><div class="grid"><div><label>Month</label><input id="month" type="month"></div><div><label>Approved</label><input id="approved" type="number" step=".25"></div><div><label>Completed</label><input id="completed" type="number" step=".25"></div><div><label>Staff / Parent Hours</label><input id="staff" type="number" step=".25"></div><div><label>ESS Direct Hours</label><input id="ess" type="number" step=".25"></div><div><label>Staff Target</label><input id="target" type="number" step=".25"></div></div><div id="err" class="err"></div><div class="actions"><button class="btn ghost" id="cancel">Cancel</button><button class="btn" id="save">Save</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.'+'eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxYW5qdXBtY2d5ZHZtZmd2dXR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA4MTI4NzQsImV4cCI6MjA3NjM4ODg3NH0.'+'J3A12rwUlSqjIsmlnNCcwis6Qt_ryw7ZzFqLftuMKUk';const sb=supabase.createClient('https://bqanjupmcgydvmfgvutx.supabase.co',K),$=x=>document.getElementById(x);const people=[['Omar','🏀','/omar-v.html','521dd725-2fa6-4d78-9fcc-e5447dc727cb',152,152,0],['Jeremy','✍🏻','/jeremy-n.html','e083501e-86d5-41e8-b840-c3ba5b6dc9c9',40,40,0],['Hayden','🦖','/Hayden_H.html','6778cce6-c1e6-4384-a6c5-5a1f8c5d481f',40,38,2],['Eric','🎤','/Eric_L.html','4dab500d-c3c8-4f0e-8673-3c537c9cc0b5',80,80,0]];let active=null;function mk(){let d=new Date;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}function ml(k){let a=k.split('-');return new Date(+a[0],+a[1]-1,1).toLocaleString(undefined,{month:'long',year:'numeric'})}people.forEach(p=>{let r=document.createElement('div');r.className='row';r.innerHTML='<a class="link" href="'+p[2]+'">'+p[1]+' '+p[0]+' Portal</a><button class="btn">Hours</button>';r.querySelector('button').onclick=()=>openM(p);$('clients').appendChild(r)});async function openM(p){active=p;$('title').textContent='Update '+p[0]+' Hours';$('month').value=mk();$('approved').value=p[4];$('completed').value=0;$('staff').value=0;$('ess').value=0;$('target').value=p[5];$('err').style.display='none';$('modal').classList.add('open');let r=await sb.from('client_logistics').select('*').eq('client_id',p[3]).eq('month_key',$('month').value).maybeSingle();if(r.data){$('approved').value=r.data.monthly_approved_hours??p[4];$('completed').value=r.data.completed_hours??0;$('staff').value=r.data.robert_hours??0;$('ess').value=r.data.ess_direct_hours??0;$('target').value=r.data.robert_target_hours??p[5]}}function closeM(){$('modal').classList.remove('open')}async function save(){let p=active,m=$('month').value||mk(),payload={client_id:p[3],month_key:m,month_label:ml(m),monthly_approved_hours:+$('approved').value||0,completed_hours:+$('completed').value||0,robert_hours:+$('staff').value||0,ess_direct_hours:+$('ess').value||0,robert_target_hours:+$('target').value||0,ess_direct_target_hours:p[6]||0,updated_at:new Date().toISOString()};let r=await sb.from('client_logistics').upsert(payload,{onConflict:'client_id,month_key'});if(r.error){$('err').textContent='Save failed: '+r.error.message;$('err').style.display='block';return}closeM()}$('cancel').onclick=closeM;$('save').onclick=save;</script></body></html>
