<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESS • Manual Hours Admin</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef5ff,#f8fbff);color:#0f172a;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:34px auto;padding:0 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:24px;box-shadow:0 18px 50px rgba(15,23,42,.12)}h1{margin:0 0 5px}.muted{color:#64748b;margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:.76rem;color:#64748b;font-weight:850;text-transform:uppercase;margin-bottom:5px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #d6dce5;border-radius:12px;font:inherit}.field textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}.summary{margin:16px 0;padding:14px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:14px;font-weight:850}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 14px;background:#0f4c81;color:#fff;font-weight:850;cursor:pointer}.btn.light{background:#fff;color:#111827;border:1px solid #cbd5e1}.btn.warn{background:#9a3412}.status{margin-top:12px;color:#475569;min-height:22px}.toplink{display:inline-block;margin-bottom:12px;text-decoration:none;color:#0f4c81;font-weight:800}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style><script>(function(){try{if(localStorage.getItem('ESS_Admin_Login')!=='true')location.replace('/portal/login.html?next='+encodeURIComponent(location.pathname+location.search))}catch(e){location.replace('/portal/login.html')}})();</script></head><body><main class="wrap"><a class="toplink" href="/portal/admin.html">← Back to Admin Portal</a><section class="card"><h1 id="title">Client Manual Hours</h1><p class="muted">Use this only when the automatic chart total needs a manual adjustment. You can return the client to automatic sync at any time.</p><div class="grid"><div class="field"><label>Month</label><input id="month" type="month"></div><div class="field"><label>Approved Monthly Hours</label><input id="approved" type="number" min="0" step="0.25"></div><div class="field"><label>Staff Hours Completed</label><input id="staff" type="number" min="0" step="0.25"></div><div class="field"><label>ESS Direct Hours Completed</label><input id="ess" type="number" min="0" step="0.25"></div><div class="field"><label>Staff Target</label><input id="staffTarget" type="number" min="0" step="0.25"></div><div class="field"><label>ESS Direct Target</label><input id="essTarget" type="number" min="0" step="0.25"></div><div class="field full"><label>Admin Note</label><textarea id="note" placeholder="Optional reason for the manual adjustment"></textarea></div></div><div class="summary" id="summary">Completed: 0 • Remaining: 0</div><div class="actions"><button class="btn light" id="reload">Reload Saved Hours</button><button class="btn" id="save">Save Manual Override</button><button class="btn warn" id="auto">Return to Automatic Sync</button></div><div class="status" id="status"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const CONFIG={omar:{id:'521dd725-2fa6-4d78-9fcc-e5447dc727cb',name:'Omar V.',short:'Omar',approved:122,staffTarget:122,essTarget:0},jeremy:{id:'e083501e-86d5-41e8-b840-c3ba5b6dc9c9',name:'Jeremy N.',short:'Jeremy',approved:40,staffTarget:40,essTarget:0},hayden:{id:'6778cce6-c1e6-4384-a6c5-5a1f8c5d481f',name:'Hayden H.',short:'Hayden',approved:40,staffTarget:38,essTarget:2},eric:{id:'4dab500d-c3c8-4f0e-8673-3c537c9cc0b5',name:'Eric L.',short:'Eric',approved:80,staffTarget:0,essTarget:80}};const key=new URLSearchParams(location.search).get('client')||'jeremy',cfg=CONFIG[key]||CONFIG.jeremy;const sb=window.supabase.createClient('https://bqanjupmcgydvmfgvutx.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxYW5qdXBtY2d5ZHZtZmd2dXR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA4MTI4NzQsImV4cCI6MjA3NjM4ODg3NH0.J3A12rwUlSqjIsmlnNCcwis6Qt_ryw7ZzFqLftuMKUk');const $=id=>document.getElementById(id);$('title').textContent=cfg.short+' Manual Hours';const monthKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`},monthLabel=k=>{const [y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleString(undefined,{month:'long',year:'numeric'})},num=v=>Number(v)||0,fmt=v=>{const x=num(v);return x%1===0?String(x):x.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')};$('month').value=monthKey();function summary(){const approved=num($('approved').value),done=num($('staff').value)+num($('ess').value);$('summary').textContent=`Completed: ${fmt(done)} / ${fmt(approved)} • Remaining: ${fmt(Math.max(0,approved-done))}`;}['approved','staff','ess','staffTarget','essTarget'].forEach(id=>$(id).addEventListener('input',summary));async function load(){const mk=$('month').value||monthKey();$('status').textContent='Loading…';const r=await sb.from('client_logistics').select('*').eq('client_id',cfg.id).eq('month_key',mk).maybeSingle();if(r.error){$('status').textContent='Could not load: '+r.error.message;return}const d=r.data||{};$('approved').value=d.monthly_approved_hours??cfg.approved;$('staff').value=d.robert_hours??0;$('ess').value=d.ess_direct_hours??0;$('staffTarget').value=d.robert_target_hours??cfg.staffTarget;$('essTarget').value=d.ess_direct_target_hours??cfg.essTarget;$('note').value=d.admin_note??'';$('status').textContent=d.manual_override?'Manual override is ACTIVE for this month.':'Automatic sync is active for this month.';summary()}async function save(){const mk=$('month').value||monthKey(),approved=num($('approved').value),staff=num($('staff').value),ess=num($('ess').value),stamp=new Date().toISOString();const payload={client_id:cfg.id,client_name:cfg.name,month_key:mk,month_label:monthLabel(mk),monthly_approved_hours:approved,completed_hours:staff+ess,remaining_hours:Math.max(0,approved-staff-ess),robert_hours:staff,robert_target_hours:num($('staffTarget').value),ess_direct_hours:ess,ess_direct_target_hours:num($('essTarget').value),manual_override:true,manual_updated_at:stamp,admin_note:$('note').value.trim()||null};$('status').textContent='Saving manual override…';const r=await sb.from('client_logistics').upsert(payload,{onConflict:'client_id,month_key'});$('status').textContent=r.error?'Save failed: '+r.error.message:'Saved ✅ Manual override is now active.';summary()}async function automatic(){if(!confirm('Return '+cfg.short+' to automatic official-chart syncing for this month?'))return;const mk=$('month').value||monthKey();$('status').textContent='Returning to automatic sync…';const r=await sb.from('client_logistics').update({manual_override:false,manual_updated_at:new Date().toISOString(),admin_note:null}).eq('client_id',cfg.id).eq('month_key',mk);$('status').textContent=r.error?'Could not release override: '+r.error.message:'Automatic sync restored ✅ Refresh the client portal to recalculate official hours.'}$('reload').onclick=load;$('save').onclick=save;$('auto').onclick=automatic;$('month').onchange=load;load();</script></body></html>
