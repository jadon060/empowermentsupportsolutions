<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ESS • Jeremy Portal</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:radial-gradient(circle at top left,#eef6ff 0,#f7f7fb 34%,#f7f7fb 100%);color:#0f172a;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #portal{display:block;width:100%;min-height:2200px;border:0;background:transparent;visibility:hidden}
  </style>
</head>
<body>
  <iframe id="portal" src="/jeremy-n.html" title="Jeremy ESS client portal"></iframe>

  <script>
    const portal=document.getElementById('portal');

    function installHaydenFormat(){
      try{
        const d=portal.contentDocument;
        if(!d || !d.head || !d.body) return;

        if(!d.getElementById('essHaydenMatchStyles')){
          const style=d.createElement('style');
          style.id='essHaydenMatchStyles';
          style.textContent=`
            html,body{margin:0!important;padding:0!important;background:radial-gradient(circle at top left,#eef6ff 0,#f7f7fb 34%,#f7f7fb 100%)!important;color:#0f172a!important;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}
            *,*::before,*::after{box-sizing:border-box}
            .about-wrap{max-width:980px!important;margin:1.5rem auto .5rem!important;padding:0 1.5rem!important}
            .about-card{background:#fff!important;border:1px solid #e5e7eb!important;border-radius:22px!important;padding:22px 24px 24px!important;display:flex!important;gap:16px!important;width:100%!important;box-shadow:0 14px 32px rgba(15,23,42,.07)!important}
            .about-avatar{width:96px!important;height:96px!important;border-radius:999px!important;object-fit:cover!important;border:4px solid #eef6ff!important;box-shadow:0 8px 20px rgba(31,95,168,.14)!important;background:#e5e7eb!important;flex:0 0 auto!important}
            .about-body h3{margin:0 0 6px!important;font-size:1.25rem!important}
            .about-body small{display:block!important;color:#6b7280!important;margin-bottom:10px!important;font-size:.9rem!important}
            .about-grid{display:flex!important;flex-wrap:wrap!important;gap:14px 32px!important}
            .about-label{font-weight:650!important;font-size:13px!important;margin-bottom:4px!important;color:#0f172a!important}
            .about-text{font-size:14px!important;line-height:1.5!important}
            .quick-links{max-width:980px!important;margin:0 auto .75rem!important;padding:0 1.5rem!important;display:flex!important;flex-wrap:wrap!important;gap:8px!important}
            .quick-link-btn{display:inline-flex!important;align-items:center!important;gap:6px!important;padding:9px 14px!important;border-radius:999px!important;border:1px solid #1f2937!important;background:#111827!important;color:#f9fafb!important;font-size:.9rem!important;text-decoration:none!important;box-shadow:0 2px 6px rgba(15,23,42,.18)!important;white-space:nowrap!important}
            .quick-link-btn--secondary{background:#fff!important;color:#111827!important;border-color:#e5e7eb!important;box-shadow:0 1px 4px rgba(15,23,42,.10)!important}
            .ess-injected-logistics{max-width:980px;margin:.9rem auto .9rem;padding:0 1.5rem}
            .ess-injected-logistics iframe{display:block;width:100%;height:520px;border:0;background:transparent}
            section[style*="max-width:980px"]{border-radius:12px!important;box-shadow:0 2px 10px rgba(0,0,0,.06)!important;border:1px solid #e5e7eb!important}
            @media(max-width:700px){
              .about-wrap,.quick-links,.ess-injected-logistics{padding-left:1rem!important;padding-right:1rem!important}
              .about-card{flex-direction:column!important;align-items:flex-start!important}
              .about-avatar{width:80px!important;height:80px!important}
              .quick-link-btn{flex:1 1 100%!important;justify-content:center!important;white-space:normal!important;text-align:center!important}
              .ess-injected-logistics iframe{height:760px}
            }
          `;
          d.head.appendChild(style);
        }

        const about=d.querySelector('.about-wrap');
        if(about && !d.getElementById('jeremyInjectedLogistics')){
          const wrap=d.createElement('div');
          wrap.id='jeremyInjectedLogistics';
          wrap.className='ess-injected-logistics';
          const frame=d.createElement('iframe');
          frame.src='/client-logistics.html?client=jeremy';
          frame.title='Jeremy monthly logistics';
          frame.setAttribute('scrolling','no');
          wrap.appendChild(frame);
          about.insertAdjacentElement('afterend',wrap);
          frame.addEventListener('load',()=>{
            try{frame.style.height=Math.max(470,frame.contentDocument.documentElement.scrollHeight+8)+'px'}catch(e){}
            resizePortal();
          });
        }

        const links=d.querySelector('.quick-links');
        if(links){
          if(!d.getElementById('jeremyEventsLink')){
            const a=d.createElement('a');
            a.id='jeremyEventsLink';a.href='/Events.html';a.className='quick-link-btn quick-link-btn--secondary';
            a.innerHTML='<span>🎉</span><span>ESS Events!</span>';
            links.appendChild(a);
          }
          if(!d.getElementById('jeremyExportLink')){
            const a=d.createElement('a');
            a.id='jeremyExportLink';a.href='/client-export.html?client=jeremy';a.className='quick-link-btn quick-link-btn--secondary';
            a.innerHTML='<span>📝</span><span>Export Session Notes</span>';
            links.appendChild(a);
          }
        }

        portal.style.visibility='visible';
        resizePortal();
      }catch(e){
        console.error('Jeremy portal formatting issue:',e);
        portal.style.visibility='visible';
      }
    }

    function resizePortal(){
      try{
        const d=portal.contentDocument;
        if(!d) return;
        const nested=d.querySelector('#jeremyInjectedLogistics iframe');
        if(nested && nested.contentDocument){
          const h=nested.contentDocument.documentElement.scrollHeight;
          if(h) nested.style.height=Math.max(470,h+8)+'px';
        }
        portal.style.height=Math.max(1800,d.documentElement.scrollHeight+30)+'px';
      }catch(e){}
    }

    portal.addEventListener('load',()=>{
      installHaydenFormat();
      setTimeout(installHaydenFormat,300);
      setTimeout(resizePortal,900);
      setTimeout(resizePortal,1800);
    });
    window.addEventListener('resize',resizePortal);
    setInterval(resizePortal,2500);
  </script>
</body>
</html>
