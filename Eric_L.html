<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ESS • Daily SDP Log (Eric)</title>
  <style>
    html,body{margin:0;padding:0;background:#f7f7fb;color:#0f172a}
    *{box-sizing:border-box}
    #ericCore{display:block;width:100%;height:1500px;border:0;background:#f7f7fb;overflow:hidden}
  </style>
</head>
<body>
  <iframe id="ericCore" src="/Eric_L_chart.html" title="Eric ESS participant chart" scrolling="no"></iframe>
  <script>
  (()=>{
    const core=document.getElementById('ericCore');
    let coreObserver=null, logisticsObserver=null;

    function setFrameHeight(frame,min,max){
      try{
        const doc=frame.contentDocument;
        if(!doc) return;
        const h=Math.ceil(Math.max(doc.body?.scrollHeight||0,doc.documentElement?.scrollHeight||0));
        if(Number.isFinite(h)&&h>0) frame.style.height=Math.max(min,Math.min(max,h+6))+'px';
      }catch(e){}
    }

    function resizeCore(){ setFrameHeight(core,900,12000); }

    function installLogistics(){
      const doc=core.contentDocument;
      if(!doc || doc.getElementById('ericLiveLogisticsMount')) return;
      const quick=doc.querySelector('.quick-links');
      if(!quick) return;

      const mount=doc.createElement('div');
      mount.id='ericLiveLogisticsMount';
      mount.style.cssText='max-width:980px;margin:.9rem auto .9rem;padding:0 1.5rem;box-sizing:border-box;';

      const frame=doc.createElement('iframe');
      frame.id='ericLiveLogisticsFrame';
      frame.src='/eric-logistics.html';
      frame.title='Eric monthly hour logistics';
      frame.scrolling='no';
      frame.style.cssText='display:block;width:100%;height:620px;border:0;background:transparent;overflow:hidden;';
      mount.appendChild(frame);
      quick.insertAdjacentElement('afterend',mount);

      const resizeLogistics=()=>{
        setFrameHeight(frame,480,1800);
        requestAnimationFrame(resizeCore);
      };

      frame.addEventListener('load',()=>{
        resizeLogistics();
        try{
          if(logisticsObserver) logisticsObserver.disconnect();
          logisticsObserver=new ResizeObserver(resizeLogistics);
          logisticsObserver.observe(frame.contentDocument.documentElement);
        }catch(e){}
        setTimeout(resizeLogistics,150);
        setTimeout(resizeLogistics,700);
      });
      requestAnimationFrame(resizeCore);
    }

    core.addEventListener('load',()=>{
      installLogistics();
      resizeCore();
      try{
        if(coreObserver) coreObserver.disconnect();
        coreObserver=new ResizeObserver(resizeCore);
        coreObserver.observe(core.contentDocument.documentElement);
      }catch(e){}
      setTimeout(()=>{installLogistics();resizeCore();},150);
      setTimeout(resizeCore,800);
    });

    window.addEventListener('resize',()=>{
      try{
        const nested=core.contentDocument?.getElementById('ericLiveLogisticsFrame');
        if(nested) setFrameHeight(nested,480,1800);
      }catch(e){}
      resizeCore();
    });
  })();
  </script>
</body>
</html>
